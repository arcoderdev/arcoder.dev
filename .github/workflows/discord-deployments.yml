name: Vercel → Discord

on:
  deployment_status:

permissions:
  contents: read

jobs:
  notify-discord:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Get branch information
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.event.deployment.sha }}
        run: |
          BRANCHES=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPOSITORY}/commits/${COMMIT}/branches-where-head" \
            --jq '.[] | .name')

          echo "Branches found:"
          echo "$BRANCHES"

          BRANCH=$(echo "$BRANCHES" | head -n 1)

          if [ -z "$BRANCH" ]; then
            BRANCH="unknown"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Send deployment notification to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOYMENTS_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.event.deployment.sha }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
        run: |
          SHORT_COMMIT="${COMMIT:0:7}"

          if [ "$BRANCH" = "main" ]; then
            TITLE="🌐 Vercel Production Ready"
            STATUS="🟢 READY"
            FOOTER="arcoder.dev • Vercel Production"
          else
            TITLE="🚀 Vercel Preview Ready"
            STATUS="🟢 READY"
            FOOTER="arcoder.dev • Vercel Preview"
          fi

          curl -H "Content-Type: application/json" \
            -d @- "$DISCORD_WEBHOOK" <<EOF
          {
            "username": "Arcoder.dev",
            "embeds": [
              {
                "title": "$TITLE",
                "description": "**${REPOSITORY}**",
                "color": 3066993,
                "fields": [
                  {
                    "name": "Branch",
                    "value": "\`${BRANCH}\`",
                    "inline": true
                  },
                  {
                    "name": "Status",
                    "value": "${STATUS}",
                    "inline": true
                  },
                  {
                    "name": "Environment",
                    "value": "${ENVIRONMENT}",
                    "inline": true
                  },
                  {
                    "name": "Commit",
                    "value": "\`${SHORT_COMMIT}\`",
                    "inline": true
                  }
                ],
                "footer": {
                  "text": "${FOOTER}"
                }
              }
            ]
          }
          EOF