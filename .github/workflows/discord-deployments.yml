name: Vercel Preview → Discord

on:
  deployment_status:

jobs:
  notify-discord:
    if: >
      github.event.deployment.ref == 'website-oficial' &&
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Send Vercel deployment to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOYMENTS_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.deployment.ref }}
          COMMIT: ${{ github.event.deployment.sha }}
          STATE: ${{ github.event.deployment_status.state }}
          DESCRIPTION: ${{ github.event.deployment_status.description }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          SHORT_COMMIT="${COMMIT:0:7}"

          curl -H "Content-Type: application/json" \
            -d @- "$DISCORD_WEBHOOK" <<EOF
          {
            "username": "ARCODER Deployments",
            "embeds": [
              {
                "title": "🚀 Vercel Preview Ready",
                "description": "**${REPOSITORY}**",
                "color": 5793266,
                "fields": [
                  {
                    "name": "Branch",
                    "value": "\`${BRANCH}\`",
                    "inline": true
                  },
                  {
                    "name": "Status",
                    "value": "🟢 READY",
                    "inline": true
                  },
                  {
                    "name": "Commit",
                    "value": "[\`${SHORT_COMMIT}\`](https://github.com/${REPOSITORY}/commit/${COMMIT})",
                    "inline": true
                  }
                ],
                "url": "${DEPLOYMENT_URL}",
                "footer": {
                  "text": "arcoder.dev • Vercel Preview"
                }
              }
            ]
          }
          EOF