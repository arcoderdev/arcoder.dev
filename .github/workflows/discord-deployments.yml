name: Vercel → Discord

on:
  deployment_status:

jobs:
  notify-discord:
    if: >
      github.event.deployment_status.state == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Send deployment notification to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_DEPLOYMENTS_WEBHOOK }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.event.deployment.sha }}
          BRANCH: ${{ github.event.deployment.ref }}
          STATUS: ${{ github.event.deployment_status.state }}
          ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          SHORT_COMMIT="${COMMIT:0:7}"

          curl -H "Content-Type: application/json" \
            -d @- "$DISCORD_WEBHOOK" <<EOF
          {
            "username": "Arcoder.dev",
            "embeds": [
              {
                "title": "🚀 Vercel Deployment Ready",
                "description": "**${REPOSITORY}**",
                "color": 3066993,
                "fields": [
                  {
                    "name": "Status",
                    "value": "🟢 READY",
                    "inline": true
                  },
                  {
                    "name": "Environment",
                    "value": "${ENVIRONMENT}",
                    "inline": true
                  },
                  {
                    "name": "Branch",
                    "value": "\`${BRANCH}\`",
                    "inline": true
                  },
                  {
                    "name": "Commit",
                    "value": "\`${SHORT_COMMIT}\`",
                    "inline": true
                  }
                ],
                "url": "${DEPLOYMENT_URL}",
                "footer": {
                  "text": "arcoder.dev • Vercel"
                }
              }
            ]
          }
          EOF